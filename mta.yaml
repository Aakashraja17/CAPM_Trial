_schema-version: 3.3.0
ID: CAPM_Learn
description: A simple CAP project.
version: 1.0.0
modules:
- name: CAPM_Learn-srv
  type: nodejs
  path: gen/srv
  requires:
  - name: CAPM_Learn-db
  - name: capm-xsuaa
  provides:
  - name: srv-api
    properties:
      srv-url: ${default-url}
  parameters:
    buildpack: nodejs_buildpack
    instances: 1
  build-parameters:
    builder: npm-ci
- name: CAPM_Learn-db-deployer
  type: hdb
  path: gen/db
  requires:
  - name: CAPM_Learn-db
  parameters:
    buildpack: nodejs_buildpack
- name: CAPM_Learn-app-content
  type: com.sap.application.content
  path: .
  requires:
  - name: CAPM_Learn-repo-host
    parameters:
      content-target: true
  build-parameters:
    build-result: resources
    requires:
    - artifacts:
      - comcapmlearnuicapm.zip
      name: comcapmlearnuicapm
      target-path: resources/
- name: comcapmlearnuicapm
  type: html5
  path: app/ui_capm
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
- name: CAPM_Learn-destination-content
  type: com.sap.application.content
  requires:
  - name: CAPM_Learn-destination-service
    parameters:
      content-target: true
  - name: CAPM_Learn-repo-host
    parameters:
      service-key:
        name: CAPM_Learn-repo-host-key
  - name: capm-xsuaa
    parameters:
      service-key:
        name: capm-xsuaa-key
  parameters:
    content:
      instance:
        destinations:
        - Name: TrialAppRouter_CAPM_Learn_repo_host
          ServiceInstanceName: CAPM_Learn-html5-service
          ServiceKeyName: CAPM_Learn-repo-host-key
          sap.cloud.service: TrialAppRouter
        - Authentication: OAuth2UserTokenExchange
          Name: TrialAppRouter_capm_xsuaa
          ServiceInstanceName: capm-xsuaa
          ServiceKeyName: capm-xsuaa-key
          sap.cloud.service: TrialAppRouter
        existing_destinations_policy: ignore
  build-parameters:
    no-source: true
resources:
- name: capm-xsuaa
  type: org.cloudfoundry.managed-service
  parameters:
    path: xs-security.json
    service: xsuaa
    service-plan: application
- name: CAPM_Learn-db
  type: com.sap.xs.hdi-container
  parameters:
    service: hana
    service-plan: hdi-shared
- name: CAPM_Learn-repo-host
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-name: CAPM_Learn-html5-service
    service-plan: app-host
- name: CAPM_Learn-destination-service
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      HTML5Runtime_enabled: true
      version: 1.0.0
    service: destination
    service-name: CAPM_Learn-destination-service
    service-plan: lite
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
build-parameters:
  before-all:
  - builder: custom
    commands:
    - npm ci
    - npx cds build --production
